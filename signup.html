<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
  <script src="js/main.js" defer></script>
  <script src="js/signup.js" defer></script>
</head>

<body class="signup-page">
    <div class="container">
      <div class="left-section">
        <h1>Join Drop In Dubai!</h1>
        <p>Sign up to unlock the best of Dubai - from hidden gems to must-visit spots and exciting events.</p>
        <p class="signin">Already have an account?</p>
        <a href="login.html" class="button-link">Sign In</a>
        <div class="go-back-home">
            <a href="index.html">⬅ Go back to Home</a>
        </div>
      </div>
      <div class="right-section">
        <h2>Sign Up</h2>
        <form id="signup-form">
          <p>Username:</p>
          <input type="text" id="name" placeholder="mickeymouse123">

          <p>Email:</p>
          <input type="email" id="email" placeholder="mickeymouse123@gmail.com">

          <p>Password:</p>
          <input type="password" id="password" placeholder="********">

          <p>Confirm password:</p>
          <input type="password" id="confirm" placeholder="********">

          <button type="submit">Sign Up</button>
        </form>
      </div>
      </div>
    </div>
  </body>
    
</html>
