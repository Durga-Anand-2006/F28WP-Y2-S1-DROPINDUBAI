<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
    <style>
    body {
        background: url('images/login.jpg') no-repeat center center/cover;
        font-family: 'Poppins', sans-serif;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-size: cover;
        background-position: center;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(181, 181, 181, 0.621); /* Reduced opacity for background image */
        z-index: -1;
    }

    .login-container {
        background-color: white;
        width: 800px; 
        background: rgba(255, 255, 255, 0.7); /* white with 70% opacity */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        border-radius: 10px;
        overflow: hidden;
    }

    .login-form {
        display: inline-block;
        padding: 40px;
        width: 60%;
        margin-top: 20px;
    }

    .login-form h1 {
        margin-bottom: 20px;
        font-size: 2em; 
        color: black;
    }

    .login-form p {
        margin-bottom: 30px;
        font-size: 14px;
        color: #666;
    }

    .login-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        font-size: 18px;
    }

    .login-form input[type="email"],
    .login-form input[type="password"] {
        width: calc(100% - 22px);
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ddd; /* Light Gray */
        border-radius: 5px;
        font-size: 1em;
        color: #333333; /* Dark Gray */
    }

    .login-form .remember-forgot {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .login-form .remember-forgot label {
        font-weight: normal;
    }

    .login-form button {
        background-color: #EC8305; 
        color: white;
        padding: 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        margin-bottom: 20px;
        font-size: 1em; 
    }

    .login-form button:hover {
        background-color:#f9b25c; 
    }

    .login-form .or-login {
        text-align: center;
        margin-top: 20px;
    }

    .login-form .register-link {
        text-align: center;
        font-size: 16px;
    }
    
    .go-back-home {
        text-align: center;
        margin-top: 70px; /* Spacing after the form */
        float: left;
    }

    .go-back-home a {
        display: inline-block;
        text-decoration: none;
        background-color: #024caa; /* Match your theme color */
        color: white;
        padding: 8px 15px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.3s ease;
    }

    .go-back-home a:hover {
        background-color: #091057; /* Darker shade on hover */
    }

    .design-section {
        width: 40%;
        background-color: #091057; 
        border-radius: 0 8px 8px 0;
        padding: 40px;
        box-sizing: border-box;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center; /* Centers the text */          
    }

    .design-section h2 {
        font-size: 2em;
        margin-bottom: 30px;
        color: white;
    }

    /* Add your design elements here using absolute positioning, shapes, etc. */
    .design-section::before, .design-section::after {
        content: '';
        position: absolute;
        /* Add your shapes and styling here */
    }
  </style>
</head>
<body>

    <div class="login-container">

        <div class="login-form">
            <h1>Sign In</h1>

            <form>
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" placeholder="Enter your mail address">

                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Enter password">

                <div class="remember-forgot">
                    <label><input type="checkbox" name="remember"> Remember me</label>
                    <a href="#">Forgot your password?</a>
                </div>

                <button type="submit">Login</button>

                <div class="register-link">Don't have an account? <a href="signup.html">Register here</a></div>
                <div class="go-back-home">
                    <a href="index.html">⬅ Go back to Home</a>
                </div>
                
            </form>
        </div>
        <div class="design-section">
            <h2>Welcome back!</h2>
            <p>Log in to plan your next escape, revisit your favourites, and unlock new adventures.</p>
        </div>
    </div>
</body>
</html>
